    "/api/v1/conversations/{conversation}/messages": {
      "get": {
        "summary": "Resume ordered persisted message history",
        "description": "50 messages/page; Phase 2 caps conversations at 20 user turns.",
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
