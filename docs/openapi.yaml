    "/sanctum/csrf-cookie": {
      "get": {
        "summary": "Initialize CSRF cookie",
        "responses": {
          "204": {
            "description": "Successful response"
          },
          "422": {
            "description": "Validation failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Rate limit exceeded"
          }
        },
        "security": []
      }
    },
    "/api/v1/register": {
      "post": {
        "summary": "Register and create personal organization",
        "responses": {
          "201": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/User"
                    }
