{
  "openapi": "3.1.0",
  "info": {
    "title": "Coding AI Assistant \u2014 Phases 1\u20133",
    "version": "3.0.0",
    "description": "Same-origin Sanctum cookie sessions with CSRF for mutations. Private project-scoped conversations, durable queued inference and resumable SSE. Configure model and credentials on server; cloud processing defaults to disabled. Private persistent memory, local CPU embeddings, hybrid retrieval and explicit unverified conversation summaries."
