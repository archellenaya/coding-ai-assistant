{
  "openapi": "3.1.0",
  "info": {
    "title": "Coding AI Assistant \u2014 Phases 1\u20132",
    "version": "2.0.0",
    "description": "Same-origin Sanctum cookie sessions with CSRF for mutations. Private project-scoped conversations, durable queued inference and resumable SSE. Configure model and credentials on server; cloud processing defaults to disabled."
  },
  "servers": [
    {
      "url": "http://localhost:8080"
    }
  ],
  "security": [
    {
      "sessionCookie": []
    }
  ],
