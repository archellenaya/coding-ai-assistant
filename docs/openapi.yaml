          "403": {
            "description": "Conversation ownership/project membership/cloud permission required"
          },
          "404": {
            "description": "Resource not found or message belongs to another conversation"
          },
          "409": {
            "description": "Active response, archived project, changed idempotent input, or invalid retry state"
          },
          "422": {
            "description": "Validation, model, cursor, retry or input/turn limit failed"
          },
          "429": {
            "description": "API rate limit; sends/retries limited to 10/minute per user"
          },
          "503": {
            "description": "Provider key/model not configured"
          }
        },
        "parameters": []
      }
    },
