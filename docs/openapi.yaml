    "/api/v1/conversations/{conversation}/messages/{message}/stream": {
      "get": {
        "summary": "Stream/replay saved current-attempt response events",
        "description": "Authenticated read-only SSE. reset {attempt}, delta {text}, completed {usage}, failed {code,message} have persisted id cursors. end {} closes terminal stream. Comments are heartbeat. Reconnect after bounded 20-second window; Last-Event-ID overrides after. Reads only current attempt and rechecks authorization per poll. No inference is started by GET.",
